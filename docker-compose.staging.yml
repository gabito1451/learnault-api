version: '3.8'

services:
  api:
    image: learnault-api:${IMAGE_TAG:-staging}
    container_name: learnault-api-staging
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-staging}
      - STELLAR_NETWORK=${STELLAR_NETWORK:-testnet}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: learnault-db-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_password}
      POSTGRES_DB: ${POSTGRES_DB:-learnault_staging}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnault} -d ${POSTGRES_DB:-learnault_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
